[package]
name = "emberdb"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "A FHIR-optimized time-series database"

[lib]
name = "emberdb"
path = "src/lib.rs"

[[bin]]
name = "emberdb"
path = "src/main.rs"

[[bin]]
name = "eval"
path = "benches/eval.rs"

[[bin]]
name = "comparative_bench"
path = "benches/comparative_bench.rs"

[[bin]]
name = "mimic_bench"
path = "benches/mimic_bench.rs"

[[bin]]
name = "baseline_bench"
path = "benches/baseline_bench.rs"

[[bin]]
name = "ember_storage_probe"
path = "benches/ember_storage_probe.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "0.4"
toml = "0.8"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = "0.19"
ureq = "2"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"
